<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英語学習エディタ</title>
<style>
    body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }
    .toolbar {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }
    .toolbar input[type="text"] {
        padding: 5px;
        width: 150px;
    }
    button {
        padding: 5px 15px;
        cursor: pointer;
    }
    #editor-container {
        display: flex;
        flex: 1;
        border: 1px solid #ccc;
        overflow: hidden;
    }
    #line-numbers {
        background: #f5f5f5;
        padding: 10px 5px;
        text-align: right;
        color: #888;
        overflow-y: hidden;
        user-select: none;
        width: 30px;
        font-family: monospace;
        line-height: 1.5;
    }
    #editor {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        outline: none;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: monospace;
        line-height: 1.5;
    }
    #editor span {
        background-color: yellow;
        color: black;
    }
    #ai-results {
        margin-top: 10px;
        padding: 15px;
        border: 1px solid #ccc;
        background: #f9f9f9;
        flex: 0 0 30%;
        overflow-y: auto;
    }
    .ai-section {
        margin-bottom: 15px;
    }
    .error {
        color: red;
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="toolbar">
        <button id="btnNew">New</button>
        <button id="btnSave">Save</button>
        <input type="file" id="fileLoad" style="display: none;">
        <button id="btnLoad">Load</button>
        <button id="btnUndo">Undo</button>
        <button id="btnRedo">Redo</button>
        <input type="text" id="inpSearch" placeholder="検索文字列">
        <button id="btnSearch">Search</button>
        <input type="text" id="inpReplace" placeholder="置換文字列">
        <button id="btnReplace">Replace</button>
        <button id="btnCheck">Check English</button>
    </div>
    <div id="editor-container">
        <div id="line-numbers">1</div>
        <div id="editor" contenteditable="true"></div>
    </div>
    <div id="ai-results">
        <div id="ai-corrected" class="ai-section"></div>
        <div id="ai-explanation" class="ai-section"></div>
        <div id="ai-error" class="error"></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const lineNumbers = document.getElementById('line-numbers');
        const inpSearch = document.getElementById('inpSearch');
        const inpReplace = document.getElementById('inpReplace');
        const fileLoad = document.getElementById('fileLoad');

        let historyStack = [];
        let historyIndex = -1;
        const maxHistory = 50;
        let isUpdating = false;

        const updateLines = () => {
            const lines = editor.innerText.split('\n').length;
            let html = '';
            for (let i = 1; i <= lines; i++) {
                html += i + '<br>';
            }
            lineNumbers.innerHTML = html;
        };

        editor.addEventListener('scroll', () => {
            lineNumbers.scrollTop = editor.scrollTop;
        });

        const saveHistory = () => {
            if (isUpdating) return;
            const text = editor.innerText;
            if (historyIndex >= 0 && historyStack[historyIndex] === text) return;
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(text);
            if (historyStack.length > maxHistory) {
                historyStack.shift();
            } else {
                historyIndex++;
            }
        };

        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = e.clipboardData.getData('text/plain');
            document.execCommand('insertText', false, text);
        });

        editor.addEventListener('input', () => {
            updateLines();
            saveHistory();
        });

        updateLines();
        saveHistory();

        document.getElementById('btnNew').addEventListener('click', () => {
            editor.innerText = '';
            updateLines();
            saveHistory();
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            const text = editor.innerText;
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'document.txt';
            a.click();
        });

        document.getElementById('btnLoad').addEventListener('click', () => fileLoad.click());
        fileLoad.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                editor.innerText = event.target.result;
                updateLines();
                saveHistory();
                fileLoad.value = '';
            };
            reader.readAsText(file);
        });

        document.getElementById('btnUndo').addEventListener('click', () => {
            if (historyIndex > 0) {
                historyIndex--;
                isUpdating = true;
                editor.innerText = historyStack[historyIndex];
                updateLines();
                isUpdating = false;
            }
        });

        document.getElementById('btnRedo').addEventListener('click', () => {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                isUpdating = true;
                editor.innerText = historyStack[historyIndex];
                updateLines();
                isUpdating = false;
            }
        });

        document.getElementById('btnSearch').addEventListener('click', () => {
            const query = inpSearch.value;
            if (!query) return;
            const text = editor.innerText;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escaped, 'g');
            
            editor.innerText = text;
            if (regex.test(text)) {
                const parts = text.split(regex);
                editor.innerHTML = '';
                parts.forEach((part, index) => {
                    editor.appendChild(document.createTextNode(part));
                    if (index < parts.length - 1) {
                        const span = document.createElement('span');
                        span.textContent = query;
                        editor.appendChild(span);
                    }
                });
            }
            updateLines();
        });

        document.getElementById('btnReplace').addEventListener('click', () => {
            const search = inpSearch.value;
            const replace = inpReplace.value;
            if (!search) return;
            const text = editor.innerText;
            editor.innerText = text.split(search).join(replace);
            updateLines();
            saveHistory();
        });

        document.getElementById('btnCheck').addEventListener('click', async () => {
            const text = editor.innerText;
            const errDiv = document.getElementById('ai-error');
            const corDiv = document.getElementById('ai-corrected');
            const expDiv = document.getElementById('ai-explanation');

            errDiv.innerText = '';
            corDiv.innerText = '';
            expDiv.innerText = '';

            if (!text.trim()) {
                errDiv.innerText = 'テキストが入力されていません。';
                return;
            }

            const apiKey = window.process?.env?.NEXT_PUBLIC_NVIDIA_API_KEY || '';
            const endpoint = 'https://integrate.api.nvidia.com/v1/chat/completions';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'nvidia/nemotron-3-super-120b-a12b',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a professional English teacher.\n\nTasks:\n1. Correct the sentence\n2. Explain mistakes simply\n\nFormat:\nCorrected:\nExplanation:'
                            },
                            {
                                role: 'user',
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error('通信失敗');
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                const matchCor = aiText.match(/Corrected:\s*(.*)/);
                const matchExp = aiText.match(/Explanation:\s*([\s\S]*)/);

                if (matchCor && matchExp) {
                    corDiv.innerText = '修正文：\n' + matchCor[1].trim();
                    expDiv.innerText = '説明：\n' + matchExp[1].trim();
                } else {
                    errDiv.innerText = '予期せぬ形式で応答を受信しました。';
                }
            } catch (e) {
                errDiv.innerText = '通信エラーが発生しました。';
            }
        });
    </script>
</body>
</html>
